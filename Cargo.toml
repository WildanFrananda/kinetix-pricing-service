[package]
name = "kinetix-pricing-service"
version = "0.1.0"
edition = "2021"
description = "Kinetix Pricing Service — Discounts, Vouchers, Flash Sales, and Product Pricing Engine in Rust (Rocket & Tonic gRPC with Diesel Async)."

[lib]
name = "kinetix_pricing_service"
path = "src/lib.rs"

[[bin]]
name = "kinetix-pricing-service"
path = "src/main.rs"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
tonic = { version = "0.11", features = ["tls"] }
tonic-reflection = "0.11"

jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
x509-parser = "0.16"
prost = "0.12"
async-trait = "0.1"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
diesel = { version = "2.2", features = ["postgres", "chrono", "uuid", "numeric"] }
diesel_migrations = { version = "2.2", features = ["postgres"] }
diesel-async = { version = "0.5", features = ["postgres", "deadpool"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.35", features = ["db-postgres", "db-diesel2-postgres", "serde"] }
rust_decimal_macros = "1.35"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

# Text exposition only. The protobuf exposition format is a second encoder, a second wire format
# and a second dependency tree, and no scraper in this estate asks for it.
prometheus = { version = "0.14", default-features = false }

# The gRPC metric layer sits inside tonic's own tower stack, so it has to speak the versions tonic
# 0.11 links: http 0.2 and http-body 0.4, not the 1.x pair reqwest brings in beside them.
http = "0.2"
http-body = "0.4"
tower-layer = "0.3"
tower-service = "0.3"

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "3.0"

[dev-dependencies]
rocket = { version = "0.5.1", features = ["json"] }
# Reads the descriptor set build.rs writes, so the gRPC metric labels are checked against the wire
# contract instead of against a list somebody remembered to update.
prost-types = "0.12"
# Lets a test serve tonic on a port the OS picked, so two test binaries never fight over one.
tokio-stream = { version = "0.1", features = ["net"] }
