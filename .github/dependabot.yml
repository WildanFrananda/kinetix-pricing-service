version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/"
    target-branch: development
    schedule:
      interval: daily
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps(docker)"
  - package-ecosystem: cargo
    directories:
      - "/"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # tonic 0.11 is built on http 0.2 and http-body 0.4, and GrpcMetricsBody implements tonic's Body.
    # http-body 1.0 replaced poll_data/poll_trailers with poll_frame, so these move only with tonic 0.12+.
    # tonic-reflection and prost are tonic's own family: 0.14 of either needs that same move, together.
    ignore:
      - dependency-name: "http"
        update-types:
          - version-update:semver-major
      - dependency-name: "http-body"
        update-types:
          - version-update:semver-major
      - dependency-name: "tonic*"
        update-types:
          - version-update:semver-major
      - dependency-name: "prost*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directories:
      - "/"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
