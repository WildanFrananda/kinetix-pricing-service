name: CI

# pricing had no CI at all until now. (kinetix-infrastructure/docs/STAGING-DEPLOYMENT-PLAN.md §5, item 6)
#
# tests/postgres_repository_test.rs needs a real database: a unique code, the idempotency ledger and the
# flash-sale lookup are decided by Postgres, not by the fakes. It migrates the database named by
# KINETIX_TEST_POSTGRES and fails when CI is set and that variable is not.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral-not-a-deployed-credential
          POSTGRES_DB: kinetix_pricing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      KINETIX_TEST_POSTGRES: "postgres://ci:ci-ephemeral-not-a-deployed-credential@localhost:5432/kinetix_pricing_test"

    steps:
      - uses: actions/checkout@v6

      # The toolchain the Dockerfile builds with, so a green run means the shipped image compiles. Named in
      # `toolchain`, not in the action's ref: Dependabot read `@1.88.0` as the action's version and proposed
      # `@1.120.0`, a Rust that does not exist. Move this and the Dockerfile's `FROM rust:` together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # build.rs generates the tonic client from .contracts/proto and refuses to run without it — there is no
      # kinetix-contracts crate, so the .proto are fetched at a pinned commit instead. The Dockerfile does
      # this too; a laptop passes without it only because .contracts/ is already there.
      - name: Fetch the contracts
        run: sh bin/sync-contracts

      - run: cargo fmt --all --check

      # Warnings fail. Clippy catches the shapes this codebase has already been bitten by: a `?` that
      # swallows a failure into a default, and a match arm that returns the wrong branch silently.
      - run: cargo clippy --all-targets --all-features -- -D warnings

      - run: cargo test --all-targets --all-features
